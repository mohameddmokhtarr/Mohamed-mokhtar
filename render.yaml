services:
  - type: web
    name: instagram-automation-tool
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite:///./app.db
